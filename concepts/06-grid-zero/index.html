function overview(){return `<div class="page">${header(1,'Operational picture.','Live priorities across Northstar Financial. Actions with operational impact require analyst approval.',btn('OPEN INCIDENT QUEUE ↗',"route('incidents')",'primary'))}<div class="grid metric-grid"><div class="metric primary"><div class="top"><span>OPEN INCIDENTS</span><span>↗</span></div><div class="value">24</div><div class="foot">4 active investigations</div><div class="ghost">01</div></div><div class="metric critical"><div class="top"><span>CRITICAL</span><span>!</span></div><div class="value">02</div><div class="foot">Both need analyst review</div></div><div class="metric"><div class="top"><span>DECISIONS WAITING</span><span>↗</span></div><div class="value">07</div><div class="foot">2 containment approvals</div></div><div class="metric"><div class="top"><span>MEDIAN TRIAGE</span><span>↘</span></div><div class="value">4<span style="font-size:.48em">m</span></div><div class="foot">38% faster than prior week</div></div></div><div class="work-grid"><section class="panel"><div class="panel-head"><h2>PRIORITY QUEUE</h2><button class="linkbtn" onclick="route('incidents')">VIEW ALL 24 ↗</button></div>${incidentTable(incidents.slice(0,4))}</section><div class="right-stack"><section class="panel"><div class="panel-head"><h2>EVENT STREAM</h2><span class="eyebrow blue">LIVE</span></div><ul class="list"><li class="event urgent"><time>14:29</time><i></i><span><b>Containment approval requested</b>FS-DC-02 · analyst decision needed</span></li><li class="event"><time>14:22</time><i></i><span><b>Investigation completed</b>12 evidence items linked to INC-1042</span></li><li class="event"><time>14:11</time><i></i><span><b>Policy escalated signal</b>Credential access · confidence 96%</span></li><li class="event"><time>14:02</time><i></i><span><b>Wazuh event ingested</b>Production environment</span></li></ul></section><div class="decision"><div class="number">02</div><div class="body"><div class="eyebrow">H function incidentPage(){let rows=incidents.filter(i=>(incidentFilter==='all'||i.severity===incidentFilter||i.status===incidentFilter)&&(`${i.title} ${i.id} ${i.host} ${i.mitre}`.toLowerCase().includes(search.toLowerCase())));return `<div class="page">${header(2,'Incidents.','Review evidence, decide the next action, and record outcomes.',btn('SUBMIT TEST ALERT',"openTestAlert()",'primary'))}<div class="toolbar"><input class="field search" id="incidentSearch" placeholder="Search incident, host, or technique" value="${esc(search)}" oninput="search=this.value;refreshIncidentTable()"><select class="field" id="incidentFilter" onchange="incidentFilter=this.value;refreshIncidentTable()"><option value="all" ${incidentFilter==='all'?'selected':''}>All incidents</option><option value="critical" ${incidentFilter==='critical'?'selected':''}>Critical</option><option value="high" ${incidentFilter==='high'?'selected':''}>High</option><option value="open" ${incidentFilter==='open'?'selected':''}>Open</option><option value="investigating" ${incidentFilter==='investigating'?'selected':''}>Investigating</option><option value="resolved" ${incidentFilter==='resolved'?'selected':''}>Resolved</option></select><span class="spacer"></span><span class="eyebrow muted">${rows.length} SHOWN / 24 TOTAL</span></div><div class="split"><section class="panel"><div class="panel-head"><h2>INCIDENT QUEUE</h2><span class="eyebrow">PRIORITY ORDER</span></div><div id="incidentTable">${incidentTable(rows)}</div></section><aside class="summary-side"><div class="panel"><div class="panel-head"><h2>QUEUE STATUS</h2></div><div class="panel-body"><div class="line"><span>Critical</span><strong class="red">02</strong></div><div class="line"><span>High</span><strong>04</strong></div><div class="line"><span>Under investigation</span><strong class="blue">04</strong></div><div class="line"><span>Awaiting review</span><strong>07</strong></div></div></div><div class="notice" style="margin-top:12px"><b>Decision control:</ function refreshIncidentTable(){let rows=incidents.filter(i=>(incidentFilter==='all'||i.severity===incidentFilter||i.status===incidentFilter)&&(`${i.title} ${i.id} ${i.host} ${i.mitre}`.toLowerCase().includes(search.toLowerCase())));e('incidentTable').innerHTML=incidentTable(rows)}
function reports(){return `<div class="page">${header(3,'Reports.','Generate a defensible account of volume, severity, response time, and outcomes.',btn('EXPORT SUMMARY ↗',"toast('Demo export prepared')",'primary'))}<div class="toolbar"><select class="field" onchange="reportPeriod=this.value;reportReady=false;render()"><option value="7d" ${reportPeriod==='7d'?'selected':''}>Last 7 days</option><option value="30d" ${reportPeriod==='30d'?'selected':''}>Last 30 days</option><option value="90d" ${reportPeriod==='90d'?'selected':''}>Last 90 days</option></select>${btn('GENERATE REPORT',"reportReady=true;toast('Report generated for selected period');render()")}<span class="eyebrow muted">${reportReady?'GENERATED 14:31 CDT':'PERIOD CHANGED · GENERATE TO REFRESH'}</span></div><div class="report-grid"><section class="panel"><div class="panel-head"><h2>OPERATIONS SUMMARY</h2><span class="eyebrow">${reportPeriod.toUpperCase()} / NORTHSTAR</span></div><div class="report-hero"><div><div class="eyebrow">INCIDENTS INVESTIGATED</div><div class="huge">${reportPeriod==='7d'?'68':reportPeriod==='90d'?'813':'284'}</div><p>Validated alerts became incident records during this period.</p></div><div><div class="eyebrow">RESOLVED WITH REVIEW</div><div class="stat">91%</div><p>Median investigation <b>14m</b> · down 26% from prior period.</p><div class="bars"><i class="b" style="width:91%"></i><i class="g" style="width:9%"></i></div></div></div></section><section class="panel"><div class="panel-head"><h2>SEVERITY DISTRIBUTION</h2><span class="eyebrow">30 DAYS</span></div><div class="segment-list"><div class="row"><span>CRITICAL</span><div class="bar"><i style="width:12%;background:var(--red)"></i></div><b>18</b></div><div class="row"><span>HIGH</span><div class="bar"><i style="width:31%;background:#e49729"></i></div><b>47</b></div><div class="row"><span>MEDIUM</span><div class="bar"><i style="width:54%;background:#d2b830"></i></div><b>82</b></div><div class="row"><span>LOW</span><div class="bar"><i style="width:90%"></i></div><b>137</b></div></div></section></div><div class="bottom-grid"><div class="panel"><div class="panel-head"><h2>TIME TO TRIAGE</h2></div><div class="panel-body"><span class="biginline">4m 12s</span><p class="muted">Median from ingestion to initial classification.</p></div></div><div class="panel"><div class="panel-head"><h2>ESCALATION RATE</h2></div><div class="panel-body"><span class="biginline blue">7.4%</span><p class="muted">Alerts requiring a human decision.</p></div></div><div class="panel"><div class="panel-head"><h2>FALSE POSITIVES</h2></div><div class="panel-body"><span class="biginline">31</span><p class="muted">Analyst dispositions recorded this period.</p></div></div></div></div>`}
function agentPage(){return `<div class="page">${header(4,'Agent fleet.','Define investigation roles and manage their availability in workflows.',btn('+ NEW AGENT',"editAgent(-1)",'primary'))}<div class="notice">Agent definitions influence investigation analysis. Prompt changes are versioned in the production product.</div><div class="agent-grid">${agents.map((a,i)=>`<article class="panel agent-card"><div class="eyebrow">AGENT ${String(i+1).padStart(2,'0')} / ${a.workflows} WORKFLOWS</div><div class="index">${String(i+1).padStart(2,'0')}</div><h2>${esc(a.name.toUpperCase())}</h2><p>${esc(a.role)}</p><div class="foot"><span class="tag ${a.status}">${a.status.toUpperCase()}</span><button class="linkbtn" onclick="editAgent(${i})">CONFIGURE ↗</button></div></article>`).join('')}</div></div>`}
function workflowPage(){let w=workflows[selectedWorkflow];return `<div class="page">${header(5,'Workflows.','Connect validated alerts to policy, specialized agents, and governed response steps.',btn('+ NEW WORKFLOW',"newWorkflow()",'primary'))}<div class="workflow-layout"><section class="panel"><div class="panel-head"><h2>DEFINITIONS</h2><span class="eyebrow">03 SAVED</span></div><div class="workflow-list">${workflows.map((x,i)=>`<button class="item ${selectedWorkflow===i?'active':''}" onclick="selectedWorkflow=${i};render()"><b>${esc(x.name)}</b><span>${esc(x.detail)} · ${x.status.toUpperCase()}</span></button>`).join('')}</div></section><div><div class="panel" style="margin-bottom:12px"><div class="panel-head"><h2>${esc(w.name.toUpperCase())}</h2><div class="head-actions"><span class="tag ${w.status}">${w.status.toUpperCase()}</span>${btn('VALIDATE',"toast('Workflow structure validated')")}${btn('EDIT',"editWorkflow()")}</div></div><div class="panel-body"><span class="eyebrow muted">VERSION 04 · LAST MODIFIED SEP 29, 2026 · HUMAN APPROVAL REQUIRED FOR CONTAINMENT</span></div></div><div class="flow-canvas"><div class="node"><div class="n">01</div><b>INGEST</b><small>WAZUH ALERT</small></div><span class="flow-arrow">→</span><div class="node"><div class="n">02</div><b>POLICY</b><small>LEVEL ≥ 12</small></div><span class="flow-arrow">→</span><div class="node"><div class="n">03</div><b>FORENSIC AI</b><small>EVIDENCE REVIEW</small></div><span class="flow-arrow">→</span><div class="node"><div class="n">04</div><b>HUMAN GATE</b><small>APPROVE ACTION</small></div></div></div></div></div>`}
function integrationPage(){return `<div class="page">${header(6,'Integrations.','Inspect configured data routes and submit a controlled pipeline test.',btn('SUBMIT TEST EVENT',"openTestAlert()",'primary'))}<div class="notice">Configuration presence does not confirm external service health. Use a test event to verify the ingestion route.</div><div class="integration-grid">${integrations.map((x,i)=>`<article class="panel integration-card"><div class="panel-head"><span class="eyebrow">${x.type}</span><span class="tag ${x.status==='CONFIGURED'?'active':''}">${x.status}</span></div><div class="panel-body"><div style="font:900 45px Impact,sans-serif;color:var(--blue)">${x.icon}</div><h2>${x.name.toUpperCase()}</h2><p>${x.description}</p></div><div class="foot"><span>${x.status==='CONFIGURED'?'CONFIG PRESENT':'SETUP REQUIRED'}</span><button class="linkbtn" onclick="configureIntegration(${i})">CONFIGURE ↗</button></div></article>`).join('')}</div></div>`}
function orgPage(){return `<div class="page">${header(7,'Organization.','Control workspace access, role assignment, and seat usage.',btn('+ INVITE MEMBER',"inviteMember()",'primary'))}<div class="grid metric-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px"><div class="metric primary"><div class="top">LICENSED SEATS</div><div class="value">25</div><div class="foot">Enterprise plan</div></div><div class="metric"><div class="top">SEATS ASSIGNED</div><div class="value">12</div><div class="foot">13 remaining</div></div><div class="metric"><div class="top">ADMINISTRATORS</div><div class="value">02</div><div class="foot">Can manage access</div></div></div><section class="panel"><div class="panel-head"><h2>MEMBER DIRECTORY</h2><span class="eyebrow">NORTHSTAR FINANCIAL</span></div><div class="table-scroll"><table class="table"><thead><tr><th>MEMBER</th><th>EMAIL</th><th>ROLE</th><th>STATUS</th><th>LAST ACTIVE</th><th></th></tr></thead><tbody>${members.map((m,i)=>`<tr><td class="title-cell">${m.name}</td><td class="mono">${m.email}</td><td><span class="tag">${m.role.toUpperCase()}</span></td><td><span class="status resolved">${m.status.toUpperCase()}</span></td><td class="mono">${m.last}</td><td><button class="linkbtn" onclick="editMember(${i})">MANAGE ↗</button></td></tr>`).join('')}</tbody></table></div><div class="scroll-cue">SWIPE TABLE →</div></section></div>`}
function settingsPage(){return `<div class="page">${header(8,'Settings.','Inspect runtime configuration, security policy, licensing, and account controls.')}<div class="settings-grid"><section class="panel"><div class="panel-head"><h2>RUNTIME & POLICY</h2><span class="eyebrow">ADMIN</span></div><div class="panel-body"><div class="settings-row"><span><b>AI provider</b><small>Local inference · active model</small></span><button class="linkbtn" onclick="settingDetail('AI provider')">VIEW ↗</button></div><div class="settings-row"><span><b>Policy engine</b><small>Tiered deterministic alert classification</small></span><button class="linkbtn" onclick="settingDetail('Policy engine')">VIEW ↗</button></div><div class="settings-row"><span><b>Automatic investigation</b><small>Analyze eligible alerts after policy validation</small></span><input class="switch" type="checkbox" checked onchange="toast('Demo preference updated')"></div><div class="settings-row"><span><b>High impact action approval</b><small>Require analyst confirmation for containment</small></span><input class="switch" type="checkbox" checked onchange="this.checked=true;toast('Approval gate is required in this demo')"></div></div></section><section class="panel"><div class="panel-head"><h2>ACCOUNT & LICENSE</h2><span class="eyebrow">NORTHSTAR</span></div><div class="panel-body"><div class="settings-row"><span><b>Enterprise license</b><small>25 seats · 12 assigned</small></span><button class="linkbtn" onclick="settingDetail('License')">VIEW ↗</button></div><div class="settings-row"><span><b>Multi-factor authentication</b><small>Enabled for your account</small></span><span class="tag active">ENABLED</span></div><div class="settings-row"><span><b>Active session</b><small>Noah Williams · administrator</small></span><button class="linkbtn" onclick="settingDetail('Active session')">VIEW ↗</button></div><div class="settings-row"><span><b>Console density</b><small>Grid Zero operational layout</small></span><select class="field" onchange="toast('Density preference updated')"><option>Standard</option><option>Compact</option></select></div></div></section></div></div>`}
const pages={overview,incidents:incidentPage,reports,agents:agentPage,workflows:workflowPage,integrations:integrationPage,organization:orgPage,settings:settingsPage};function route(id){current=id;history.replaceState(null,'','#'+id);render();e('main').scrollTop=0}function render(){e('nav').innerHTML=navItems.map(([id,label],i)=>`<button class="${current===id?'active':''}" onclick="route('${id}')"><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span>${label}</span>${id==='incidents'?'<span class="count">07</span>':''}</button>`).join('');e('main').innerHTML=pages[current]();document.title=`${navItems.find(x=>x[0]===current)[1]} · Terminus SOC`}
function modal(title,body,actions){e('modalTitle').textContent=title;e('modalBody').innerHTML=body;e('modalActions').innerHTML=actions||btn('CLOSE','closeModal()');e('modal').classList.add('open')}function closeModal(){e('modal').classList.remove('open')}function toast(t){let el=e('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function openIncident(id){let i=incidents.find(x=>x.id===id);modal(i.id,`<div class="eyebrow">INCIDENT DOSSIER / ${i.host} / ${i.mitre}</div><h2 class="display" style="font-size:32px;line-height:1;margin:9px 0">${esc(i.title.toUpperCase())}</h2><p>${sev(i.severity)} ${status(i.status)} <span class="tag">CONFIDENCE ${i.confidence}</span></p><div class="kv"><div class="line"><span>Host asset</span><b class="mono">${i.host}</b></div><div class="line"><span>Evidence items</span><b>${i.evidence}</b></div><div class="line"><span>Assigned analyst</span><b>${i.owner}</b></div><div class="line"><span>MITRE technique</span><b class="mono">${i.mitre}</b></div></div><p><b>AI assessment</b><br>Correlated security telemetry indicates activity requiring analyst review. Verify process lineage, affected identities, and host impact before response.</p><p><b>Decision boundary</b><br>Containment can interrupt connected services. Review blast radius and confirm the target before executing any action.</p>`,`${btn('ASK COPILOT',`"askCopilot('${id}')"`)}${btn('MARK INVESTIGATING',`"markInvestigating('${id}')"`)}${btn('RESOLVE',`"resolveIncident('${id}')"`,'primary')}`.replaceAll('""','"'))}
function askCopilot(id){modal('Analyst copilot',`<p class="eyebrow">${id} / EVIDENCE ASSISTANT</p><p>Ask about the observed telemetry, possible root cause, or recommended next checks.</p><label for="copilotQuestion">QUESTION</label><textarea class="field" id="copilotQuestion" placeholder="Which evidence supports this verdict?"></textarea><p id="copilotAnswer" class="notice" style="display:none"></p>`,`${btn('CLOSE','closeModal()')}${btn('ASK',`"copilotReply()"`,'primary')}`.replaceAll('""','"'))}function copilotReply(){let q=e('copilotQuestion').value.trim();if(!q)return toast('Enter a question');e('copilotAnswer').style.display='block';e('copilotAnswer').textContent='Demo response: Review the source alert, affected host timeline, process lineage, and correlated indicators. The current assessment is based on available evidence and requires analyst verification.'}
function markInvestigating(id){let i=incidents.find(x=>x.id===id);i.status='investigating';i.owner='You';closeModal();render();toast(`${id} marked investigating`)}function resolveIncident(id){modal('Resolve incident',`<p class="eyebrow">${id} / ANALYST DISPOSITION</p><label for="resolutionType">OUTCOME</label><select class="field" id="resolutionType"><option>True positive</option><option>False positive</option><option>Benign activity</option></select><label for="resolutionNotes">RESOLUTION NOTES</label><textarea class="field" id="resolutionNotes" placeholder="Document evidence and action taken..."></textarea>`,`${btn('CANCEL','closeModal()')}${btn('RECORD RESOLUTION',`"saveResolution('${id}')"`,'primary')}`.replaceAll('""','"'))}function saveResolution(id){if(!e('resolutionNotes').value.trim())return toast('Add resolution notes');incidents.find(x=>x.id===id).status='resolved';closeModal();render();toast(`${id} resolved in demo`)}
function openTestAlert(){modal('Submit test alert',`<p>Creates a <b>local demo result</b> in this prototype. In the production console, test alerts enter the configured investigation pipeline.</p><label for="testScenario">SCENARIO</label><select class="field" id="testScenario"><option>SSH authentication failures</option><option>Log4Shell lookup attempt</option><option>Suspicious file encryption</option></select><label for="testPayload">OPTIONAL JSON PAYLOAD</label><textarea class="field mono" id="testPayload" placeholder='{"rule":{"level":8},"agent":{"name":"Training endpoint"}}'></textarea>`,`${btn('CANCEL','closeModal()')}${btn('SUBMIT TEST',`"submitTestAlert()"`,'primary')}`.replaceAll('""','"'))}function submitTestAlert(){let v=e('testPayload').value.trim();if(v){try{JSON.parse(v)}catch{return toast('Payload must be valid JSON')}}closeModal();toast('Demo test alert submitted')}
function editAgent(i){let a=agents[i]||{name:'',role:'',status:'active',prompt:''};modal(i<0?'New agent definition':'Configure agent',`<label for="agentName">NAME</label><input class="field" id="agentName" value="${esc(a.name)}"><label for="agentRole">ROLE DESCRIPTION</label><textarea class="field" id="agentRole">${esc(a.role)}</textarea><label for="agentPrompt">SYSTEM PROMPT</label><textarea class="field" id="agentPrompt">${esc(a.prompt)}</textarea><label for="agentStatus">STATUS</label><select class="field" id="agentStatus"><option ${a.status==='active'?'selected':''}>active</option><option ${a.status==='paused'?'selected':''}>paused</option><option ${a.status==='maintenance'?'selected':''}>maintenance</option></select>`,`${btn('CANCEL','closeModal()')}${btn('SAVE',`"saveAgent(${i})"`,'primary')}`.replaceAll('""','"'))}function saveAgent(i){let name=e('agentName').value.trim(),role=e('agentRole').value.trim(),prompt=e('agentPrompt').value.trim();if(!name||!role||!prompt)return toast('Complete all agent fields');let a={name,role,prompt,status:e('agentStatus').value,workflows:i<0?0:agents[i].workflows};if(i<0)agents.push(a);else agents[i]=a;closeModal();render();toast('Agent definition saved in demo')}
function newWorkflow(){modal('New workflow',`<label for="workflowName">WORKFLOW NAME</label><input class="field" id="workflowName" placeholder="New investigation workflow"><label for="workflowTrigger">TRIGGER</label><select class="field" id="workflowTrigger"><option>Wazuh alert</option><option>Critical severity</option><option>Credential access technique</option></select>`,`${btn('CANCEL','closeModal()')}${btn('CREATE',`"saveWorkflow()"`,'primary')}`.replaceAll('""','"'))}function saveWorkflow(){let n=e('workflowName').value.trim();if(!n)return toast('Enter a workflow name');workflows.push({name:n,detail:'Wazuh alert · 4 stages',status:'paused'});selectedWorkflow=workflows.length-1;closeModal();render();toast('Workflow created in demo')}function editWorkflow(){let w=workflows[selectedWorkflow];modal('Edit workflow',`<label for="workflowEditName">NAME</label><input class="field" id="workflowEditName" value="${esc(w.name)}"><label for="workflowStatus">STATUS</label><select class="field" id="workflowStatus"><option ${w.status==='active'?'selected':''}>active</option><option ${w.status==='paused'?'selected':''}>paused</option></select><p>Node editing is represented by the validated canvas behind this dialog.</p>`,`${btn('CANCEL','closeModal()')}${btn('SAVE',`"saveWorkflowEdit()"`,'primary')}`.replaceAll('""','"'))}function saveWorkflowEdit(){let n=e('workflowEditName').value.trim();if(!n)return toast('Enter a workflow name');workflows[selectedWorkflow].name=n;workflows[selectedWorkflow].status=e('workflowStatus').value;closeModal();render();toast('Workflow updated in demo')}
function configureIntegration(i){let x=integrations[i];modal(`Configure ${x.name}`,`<p>${x.description}</p><div class="notice">Current state: <b>${x.status}</b>. This prototype keeps configuration local and does not contact an external service.</div><label for="integrationEndpoint">ENDPOINT / DESTINATION</label><input class="field mono" id="integrationEndpoint" placeholder="https://service.example/endpoint"><label for="integrationEnabled">ENABLE ROUTE</label><select class="field" id="integrationEnabled"><option ${x.status==='CONFIGURED'?'selected':''}>Configured</option><option ${x.status!=='CONFIGURED'?'selected':''}>Not set</option></select>`,`${btn('CANCEL','closeModal()')}${btn('SAVE',`"saveIntegration(${i})"`,'primary')}`.replaceAll('""','"'))}function saveIntegration(i){integrations[i].status=e('integrationEnabled').value==='Configured'?'CONFIGURED':'NOT SET';closeModal();render();toast('Integration state updated in demo')}
function inviteMember(){modal('Invite member',`<label for="inviteName">FULL NAME</label><input class="field" id="inviteName" placeholder="Name"><label for="inviteEmail">EMAIL</label><input class="field" id="inviteEmail" type="email" placeholder="name@northstar.example"><label for="inviteRole">ROLE</label><select class="field" id="inviteRole"><option>Viewer</option><option>Member</option><option>Admin</option></select>`,`${btn('CANCEL','closeModal()')}${btn('ADD TO DEMO',`"saveInvite()"`,'primary')}`.replaceAll('""','"'))}function saveInvite(){let n=e('inviteName').value.trim(),email=e('inviteEmail').value.trim();if(!n||!email.includes('@'))return toast('Enter a name and valid email');members.push({name:n,email,role:e('inviteRole').value,status:'Invited',last:'—'});closeModal();render();toast('Member added to demo directory')}function editMember(i){let m=members[i];modal(`Manage ${m.name}`,`<p class="mono">${m.email}</p><label for="memberRole">WORKSPACE ROLE</label><select class="field" id="memberRole">${['Viewer','Member','Admin'].map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select>`,`${btn('CANCEL','closeModal()')}${btn('SAVE ROLE',`"saveMember(${i})"`,'primary')}`.replaceAll('""','"'))}function saveMember(i){members[i].role=e('memberRole').value;closeModal();render();toast('Member role updated in demo')}
function settingDetail(s){modal(s,`<p>This is the current <b>${s}</b> configuration for Northstar Financial. Administrative changes here would be saved to the organization in the production console.</p><div class="kv"><div class="line"><span>Workspace</span><b>Northstar Financial</b></div><div class="line"><span>Access</span><b>Administrator</b></div><div class="line"><span>Region</span><b>Chicago</b></div></div>`,btn('CLOSE','closeModal()'))}
const originalModal=modal;modal=function(title,body,actions){originalModal(title,body,actions);e('modal').querySelector('.modal').style.width=title.startsWith('INC-')?'min(820px,100%)':''};
let timeRange='24h';const originalRender=render;render=function(){originalRender();if(current==='incidents'){const selector=document.createElement('select');selector.className='field';selector.id='timeRange';selector.setAttribute('aria-label','Time range');selector.innerHTML=`<option value="1h" ${timeRange==='1h'?'selected':''}>Last 1 hour</option><option value="2h" ${timeRange==='2h'?'selected':''}>Last 2 hours</option><option value="24h" ${timeRange==='24h'?'selected':''}>Last 24 hours</option>`;selector.onchange=()=>{timeRange=selector.value;refreshIncidentTable()};e('incidentFilter').before(selector);refreshIncidentTable()}};
refreshIncidentTable=function(){const max=timeRange==='1h'?60:timeRange==='2h'?120:1440;const minutes=age=>age.includes('h')?Number(age.split('h')[0])*60+(Number((age.split('h')[1]||'').replace(/\D/g,''))||0):Number(age.replace(/\D/g,''));let rows=incidents.filter(i=>minutes(i.age)<=max&&(incidentFilter==='all'||i.severity===incidentFilter||i.status===incidentFilter)&&(`${i.title} ${i.id} ${i.host} ${i.mitre}`.toLowerCase().includes(search.toLowerCase())));e('incidentTable').innerHTML=incidentTable(rows)};
function dossierSection(i,tab){if(tab==='raw'){const raw={timestamp:'2026-10-02T14:22:10-05:00',rule:{id:'9281',level:i.severity==='critical'?13:10,description:i.title,mitre:[i.mitre]},agent:{name:i.host,id:'0042'},network:{source_ip:'10.14.8.22',destination_ip:'10.14.0.5',protocol:'TCP'},event:{action:'detected',status:i.status},confidence:i.confidence};return `<div class="eyebrow blue" style="margin:15px 0 8px">NORMALIZED FIELDS / SOURCE EVENT</div><div class="kv"><div class="line"><span>Event timestamp</span><b class="mono">${raw.timestamp}</b></div><div class="line"><span>Rule ID / Level</span><b class="mono">9281 / ${raw.rule.level}</b></div><div class="line"><span>Source → Destination</span><b class="mono">10.14.8.22 → 10.14.0.5</b></div><div class="line"><span>Protocol / Action</span><b class="mono">TCP / DETECTED</b></div></div><div class="eyebrow blue" style="margin:17px 0 7px">RAW JSON</div><pre style="background:#171917;color:#e7ebff;padding:13px;overflow:auto;font:10px/1.5 Consolas,monospace">${esc(JSON.stringify(raw,null,2))}</pre>`}if(tab==='timeline')return `<div class="eyebrow blue" style="margin:15px 0 8px">INCIDENT TIMELINE</div><div class="kv"><div class="line"><span class="mono">14:02:11</span><b>Wazuh alert received from ${i.host}</b></div><div class="line"><span class="mono">14:05:47</span><b>Policy escalated to investigation</b></div><div class="line"><span class="mono">14:22:10</span><b>Evidence synthesis completed · ${i.evidence} items</b></div><div class="line"><span class="mono">14:29:02</span><b>Human review requested</b></div></div><div class="eyebrow blue" style="margin:17px 0 8px">RELATED ALERTS</div><p>Two related events from ${i.host} in the last hour. Open the queue and filter by host to review the full event set.</p>`;return `<div class="eyebrow blue" style="margin:15px 0 8px">RULE REASON</div><p>Wazuh rule <b>9281</b> matched telemetry from <b>${i.host}</b>. The policy engine escalated the signal because its level and evidence context met the investigation threshold.</p><div class="eyebrow blue" style="margin:16px 0 8px">HIGHLIGHTED EVIDENCE</div><div class="kv"><div class="line"><span>Host</span><b class="mono">${i.host}</b></div><div class="line"><span>MITRE ATT&CK</span><b class="mono">${i.mitre}</b></div><div class="line"><span>Rule ID / Level</span><b class="mono">9281 / ${i.severity==='critical'?'13':'10'}</b></div><div class="line"><span>Source IP</span><b class="mono">10.14.8.22</b></div><div class="line"><span>Destination IP</span><b class="mono">10.14.0.5</b></div><div class="line"><span>Protocol / Event action</span><b class="mono">TCP / DETECTED</b></div></div><p><b>AI assessment:</b> Correlated telemetry indicates activity requiring analyst review. Verify process lineage, affected identities, and host impact before response.</p>`}
function switchDossierTab(id,tab){let i=incidents.find(x=>x.id===id);e('dossierContent').innerHTML=dossierSection(i,tab);document.querySelectorAll('.dossier-tab').forEach(b=>b.classList.toggle('primary',b.dataset.tab===tab))}
function openIncident(id){let i=incidents.find(x=>x.id===id);modal(i.id,`<div class="eyebrow">INCIDENT DOSSIER / ${i.host} / ${i.mitre}</div><h2 class="display" style="font-size:32px;line-height:1;margin:9px 0">${esc(i.title.toUpperCase())}</h2><p>${sev(i.severity)} ${status(i.status)} <span class="tag">CONFIDENCE ${i.confidence}</span> <span class="tag">${i.evidence} EVIDENCE ITEMS</span></p><div style="display:flex;gap:5px;border-bottom:1px solid var(--ink);padding:8px 0"><button class="btn primary dossier-tab" data-tab="overview" onclick="switchDossierTab('${id}','overview')">OVERVIEW</button><button class="btn dossier-tab" data-tab="raw" onclick="switchDossierTab('${id}','raw')">EVENT FIELDS</button><button class="btn dossier-tab" data-tab="timeline" onclick="switchDossierTab('${id}','timeline')">TIMELINE</button></div><div id="dossierContent">${dossierSection(i,'overview')}</div>`,`${btn('ASK COPILOT',`askCopilot('${id}')`)}${btn('INVESTIGATE',`markInvestigating('${id}')`)}${btn('REQUEST CONTAINMENT',`requestContainment('${id}')`)}${btn('RESOLVE',`resolveIncident('${id}')`,'primary')}`)}
function requestContainment(id){let i=incidents.find(x=>x.id===id);modal('Containment review',`<div class="notice"><b>HIGH IMPACT ACTION:</b> Isolating ${i.host} could interrupt dependent services. This prototype records a local review only and does not execute containment.</div><div class="kv"><div class="line"><span>Target host</span><b class="mono">${i.host}</b></div><div class="line"><span>Incident</span><b class="mono">${id}</b></div><div class="line"><span>Approval authority</span><b>Analyst / Admin</b></div></div><label for="containmentReason">REASON FOR REQUEST</label><textarea class="field" id="containmentReason" placeholder="Describe evidence and expected impact..."></textarea>`,`${btn('CANCEL','closeModal()')}${btn('RECORD REQUEST','recordContainment()','danger')}`)}function recordContainment(){if(!e('containmentReason').value.trim())return toast('Document the reason for containment');closeModal();toast('Containment review recorded in demo; no action executed')}
e('modal').addEventListener('click',ev=>{if(ev.target===e('modal'))closeModal()});window.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});e('clock').textContent=new Date().toLocaleString('en-US',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});let initial=location.hash.slice(1);if(pages[initial])current=initial;render();
</script></body></html>
