function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function heading(kicker,title,desc,actions=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="heading-actions">${actions}</div></div>`}

function filteredAlerts(){return alerts.filter(a=>{const q=state.search.toLowerCase();return (!q||[a.id,a.title,a.rule,a.host,a.src,a.dst,a.source].some(v=>v.toLowerCase().includes(q)))&&(state.severity==='all'||a.sev===state.severity)&&(state.status==='all'||a.state===state.status)&&(state.time==='24h'||a.ago<=({'1h':60,'4h':240,'7d':10080}[state.time]||1440))})}
function alertRows(items){return items.map(a=>`<tr class="${state.selected===a.id&&state.page==='incidents'?'selected':''}"><td class="mono muted">${a.time.slice(11)}</td><td><button class="row-btn" data-select="${a.id}">${esc(a.title)}</button><span class="rule">${esc(a.id)} · ${esc(a.rule)}</span></td><td>${badge(a.sev)}</td><td class="host">${a.host}</td><td>${a.source}</td><td>${badge(a.state)}</td></tr>`).join('')}
function alertTable(items){return `<div class="tablewrap"><table class="table"><thead><tr><th>Time</th><th>Alert / rule context</th><th>Severity</th><th>Endpoint</th><th>Source</th><th>State</th></tr></thead><tbody>${items.length?alertRows(items):`<tr><td colspan="6"><div class="empty"><b>No alerts match these filters</b>Try another time range, severity, or search term.</div></td></tr>`}</tbody></table></div>`}
function dossier(){const a=alerts.find(x=>x.id===state.selected);if(!a)return `<div class="panel dossier"><div class="dossier-empty"><b>Select an alert</b>Open a row to inspect its evidence and response history.</div></div>`;const raw=esc(a.raw).replaceAll(esc(a.src),`<mark>${esc(a.src)}</mark>`).replaceAll(esc(a.host),`<mark>${esc(a.host)}</mark>`);let body='';if(state.dossierTab==='assessment')body=`<h3>Assessment</h3><p>${esc(a.summary)}</p><div class="note">AI assessment is a working hypothesis. Verify the source event before taking response action.</div><h3>Highlighted fields</h3><div class="facts"><div class="fact"><span>Rule / level</span><b>${esc(a.rule)} / ${a.level}</b></div><div class="fact"><span>Endpoint / agent</span><b>${a.host} · ${a.agent}</b></div><div class="fact"><span>Source → destination</span><b>${a.src} → ${a.dst}</b></div><div class="fact"><span>Protocol / action</span><b>${a.protocol} · ${a.action}</b></div><div class="fact"><span>MITRE technique</span><b>${a.mitre}</b></div><div class="fact"><span>Data source</span><b>${a.source}</b></div></div><h3>Suggested next step</h3><p>Confirm the affected account or host context; compare related events; record the response decision.</p>`;if(state.dossierTab==='activity')body=`<h3>Related activity</h3><div class="timeline"><div><b>Detection matched ${esc(a.rule)}</b><small>${a.time} · ${a.source}</small></div><div><b>Correlated to endpoint ${a.host}</b><small>Agent ${a.agent} · source ${a.src}</small></div><div><b>Terminus investigation created</b><small>${a.id} · MITRE ${a.mitre}</small></div><div><b>Current state: ${a.state}</b><small>Analyst action history appears here</small></div></div><h3>Other alerts on this host</h3>${alerts.filter(x=>x.host===a.host&&x.id!==a.id).map(x=>`<button class="btn small" data-select="${x.id}">${x.id}</button>`).join('')||'<p>No other alerts on this host in the demo window.</p>'}`;if(state.dossierTab==='raw')body=`<h3>Original event</h3><p>The source event is shown below. Matching source and endpoint fields are highlighted.</p><pre class="raw">${raw}</pre><h3>Provenance</h3><div class="facts"><div class="fact"><span>Source product</span><b>${a.source}</b></div><div class="fact"><span>Received</span><b>${a.time} CDT</b></div></div>`;return `<section class="panel dossier"><div class="dossier-title"><div>${badge(a.sev)} ${badge(a.state)}</div><h2>${esc(a.title)}</h2><p>${a.id} · ${a.time} CDT · ${a.source}</p></div><div class="dossier-actions"><button class="btn small" data-action="investigate" ${a.state==='investigating'?'disabled':''}>Start investigation</button><button class="btn small" data-action="resolve" ${a.state==='resolved'?'disabled':''}>Resolve case</button><button class="btn small danger" data-action="contain">Contain endpoint</button></div><div class="tabs"><button class="tab ${state.dossierTab==='assessment'?'active':''}" data-tab="assessment">Assessment</button><button class="tab ${state.dossierTab==='activity'?'active':''}" data-tab="activity">Activity</button><button class="tab ${state.dossierTab==='raw'?'active':''}" data-tab="raw">Raw event</button></div><div class="dossier-content">${body}</div></section>`}
function overview(){const open=alerts.filter(a=>a.state!=='resolved');return heading('Operations / Friday, October 2','Today’s signals','Priority incidents, endpoint posture, and the response path for this workspace.',`<button class="btn" data-action="refresh">↻ Refresh</button><button class="btn primary" data-page="incidents">Review alerts →</button>`)+`<div class="kpis"><div class="kpi alert"><small>Needs intervention</small><strong>${alerts.filter(a=>a.sev==='critical'&&a.state!=='resolved').length.toString().padStart(2,'0')}</strong><em>critical alerts</em></div><div class="kpi warn"><small>Open investigations</small><strong>${alerts.filter(a=>a.state==='investigating').length.toString().padStart(2,'0')}</strong><em>analyst review</em></div><div class="kpi good"><small>Resolved today</small><strong>${alerts.filter(a=>a.state==='resolved').length.toString().padStart(2,'0')}</strong><em>cases completed</em></div><div class="kpi"><small>Endpoint coverage</small><strong>3 / 4</strong><em>agents connected</em></div></div><div class="overview-grid"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>Priority alert queue</h2><small>Sorted by severity and time received</small></div><button class="link" data-page="incidents">Open all alerts ↗</button></div>${alertTable(open.slice(0,4))}<div class="panel-footer"><span>${open.length} active alerts in sample window</span><button class="link" data-page="incidents">Triage queue →</button></div></section><section class="panel"><div class="panel-head"><h2>Endpoint coverage</h2><small>Wazuh agent state · demo snapshot</small></div><div class="tablewrap"><table class="table"><thead><tr><th>Endpoint</th><th>Group</th><th>Agent</th><th>Last seen</th><th>Alerts</th></tr></thead><tbody>${endpoints.map(e=>`<tr><td class="host">${e.host}</td><td>${e.group}</td><td><span class="status-dot ${e.state==='Disconnected'?'warn':''}"></span>${e.state}</td><td>${e.seen}</td><td>${e.alerts}</td></tr>`).join('')}</tbody></table></div></section></div><div class="stack"><section class="panel assessment"><div class="eyebrow">Case in focus / INC-2048</div><h2>Evidence suggests credential compromise</h2><p>14 failed sign-ins preceded privileged access on DC-PROD-04. The next step is to verify account ownership and compare the identity trail.</p><ul><li><span>✓</span> Rule 60122 · level 13 on agent 004</li><li><span>✓</span> Source 198.51.100.42 reached 10.40.8.14</li><li><span>→</span> Review before containment</li></ul><button class="btn primary small" data-open="INC-2048">Open case dossier →</button></section><section class="panel"><div class="panel-head"><h2>Alert activity</h2><small>Last 24 hours</small></div><div class="panel-body"><div class="density">${[27,34,22,48,31,46,29,55,41,38,67,47,79,53,62,91,68,47,57,39,52,74,59,42].map((h,i)=>`<i class="${i===15||i===16?'hot':''}" style="height:${h}%"></i>`).join('')}</div><div class="density-labels"><span>24h ago</span><span>12h</span><span>Now</span></div></div></section><section class="panel"><div class="panel-head"><h2>Recent activity</h2></div><div class="activity-list"><div class="activity"><i class="hot"></i><div><b>INC-2048 created</b><small>Credential anomaly · 09:34 CDT</small></div></div><div class="activity"><i></i><div><b>INC-2046 investigation started</b><small>WS-FIN-12 · 09:24 CDT</small></div></div><div class="activity"><i></i><div><b>INC-2034 resolved</b><small>Expected deployment activity · 08:02 CDT</small></div></div></div></section></div></div>`}
function incidents(){const items=filteredAlerts();return heading('Operations / investigation','Incidents','Search alert evidence, compare endpoint context, and document response decisions.',`<button class="btn" data-action="export-alerts">↓ Export visible</button>`)+`<div class="toolbar"><div><label class="control-label" for="alert-search">Search alerts</label><input class="field wide" id="alert-search" placeholder="Rule, host, IP, incident ID…" value="${esc(state.search)}"></div><div><label class="control-label" for="time-filter">Time window</label><select class="field" id="time-filter"><option value="1h">Last hour</option><option value="4h">Last 4 hours</option><option value="24h">Last 24 hours</option><option value="7d">Last 7 days</option></select></div><div><label class="control-label" for="severity-filter">Severity</label><select class="field" id="severity-filter"><option value="all">All severity</option><option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option></select></div><div><label class="control-label" for="status-filter">State</label><select class="field" id="status-filter"><option value="all">All states</option><option value="open">Open</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option></select></div><button class="btn" data-action="clear-filters">Clear</button></div><div class="split"><section class="panel"><div class="panel-head"><h2>Alert queue</h2><small id="result-count">${items.length} events · local sample · scroll table →</small></div><div id="alert-table">${alertTable(items)}</div><div class="panel-footer"><span>Fields: timestamp · rule · level · endpoint · source · state</span><button class="link" data-action="refresh">Refresh snapshot ↻</button></div></section><div id="dossier-slot">${dossier()}</div></div>`}

function workflows(){return heading('Automation / protocol builder','Workflows','Connect triggers, conditions, agents, and outputs into reviewable response definitions.',`<button class="btn primary" data-action="save-workflow">Save definition</button>`)+`<div class="toolbar"><div><label class="control-label">Workflow</label><select class="field" id="workflow-select"><option>Credential anomaly response</option><option>Network exploit review</option><option>Endpoint encryption triage</option></select></div><button class="btn" data-action="validate-workflow">Validate</button></div><section class="panel"><div class="panel-head"><h2 id="workflow-title">${state.workflow}</h2><small>Draft definition · execution disabled</small></div><div class="flow-line"><div class="flow-node"><span class="eyebrow">01 / Trigger</span><b>${state.workflow==='Network exploit review'?'Snort alert':'Wazuh alert'}</b><small>New event received</small></div><span class="flow-arrow">→</span><div class="flow-node"><span class="eyebrow">02 / Condition</span><b>Severity ≥ 10</b><small>Branch on rule level</small></div><span class="flow-arrow">→</span><div class="flow-node"><span class="eyebrow">03 / Agent</span><b>Identity analyst</b><small>Correlate evidence</small></div><span class="flow-arrow">→</span><div class="flow-node"><span class="eyebrow">04 / Output</span><b>Create ticket</b><small>Jira summary draft</small></div></div></section><div class="card-grid" style="margin-top:15px"><section class="panel module"><div class="eyebrow">Step 01</div><h3>Trigger</h3><p>Wazuh event with a matching rule group enters the definition.</p><button class="btn small" data-action="edit-node">Edit trigger</button></section><section class="panel module"><div class="eyebrow">Step 02</div><h3>Condition</h3><p>Only alerts above the selected severity threshold continue.</p><button class="btn small" data-action="edit-node">Edit condition</button></section><section class="panel module"><div class="eyebrow">Step 03</div><h3>Response</h3><p>Investigation can draft a ticket. Active response needs approval.</p><button class="btn small" data-action="edit-node">Edit output</button></section></div>`}

function settings(){return heading('Workspace / installation','Settings','Runtime details, response policy, account, and appearance for this installation.')+`<div class="report-grid"><section class="panel"><div class="panel-head"><h2>System and policy</h2></div><div class="setting-row"><div><b>Console API</b><small>Connection to the Terminus service</small></div><strong>DEMO DATA</strong></div><div class="setting-row"><div><b>Investigation model</b><small>Local LLM runtime</small></div><strong>LOCAL</strong></div><div class="setting-row"><div><b>Containment guardrail</b><small>Host isolation and IP blocks</small></div><strong>APPROVAL REQUIRED</strong></div><div class="setting-row"><div><b>Workflow execution</b><small>Definitions may be saved; automated execution unavailable</small></div><strong>DEFINITION ONLY</strong></div></section><section class="panel"><div class="panel-head"><h2>Personal settings</h2></div><div class="setting-row"><div><b>Signed in as</b><small>Noah Williams · Administrator</small></div><strong>ACCOUNT</strong></div><div class="setting-row"><div><b>Appearance</b><small>Choose an interface theme for this demo</small></div><select class="field" id="theme-select"><option value="clinical">Clinical light</option><option value="contrast">High contrast</option></select></div><div class="setting-row"><div><b>Time zone</b><small>Used to display alert timestamps</small></div><strong>AMERICA/CHICAGO</strong></div></section></div>`}
const pages={overview,incidents,reports,agents:agentPage,workflows,integrations,organization,settings};const names={overview:'Overview',incidents:'Incidents',reports:'Reports',agents:'Agent fleet',workflows:'Workflows',integrations:'Integrations',organization:'Organization',settings:'Settings'};
function render(){const page=pages[state.page]?state.page:'overview';state.page=page;$('#main').innerHTML=pages[page]();$('#crumb').textContent=names[page];document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('#sidebar').classList.remove('open');if(page==='incidents'){ $('#time-filter').value=state.time;$('#severity-filter').value=state.severity;$('#status-filter').value=state.status;}if(page==='reports')$('#report-range').value=state.reportRange;if(page==='workflows')$('#workflow-select').value=state.workflow;if(page==='settings')$('#theme-select').value=state.theme;$('#nav-count').textContent=alerts.filter(a=>a.sev==='critical'&&a.state!=='resolved').length;document.title=`${names[page]} · Terminus`;}

function selectedAlert(){return alerts.find(a=>a.id===state.selected)}
function action(type){const a=selectedAlert();if(type==='refresh')toast('Demo snapshot refreshed · no live service connected');else if(type==='clear-filters'){state.search='';state.severity='all';state.status='all';state.time='24h';render()}else if(type==='investigate'){a.state='investigating';toast(`${a.id} moved to Investigating`);render()}else if(type==='resolve'){modal('Resolve incident',`<p>Record a disposition for <b>${a.id}</b>. This updates only the local demo.</p><div class="form-row"><label for="disposition">Disposition</label><select class="field" id="disposition"><option>True positive</option><option>False positive</option><option>Benign activity</option></select></div><div class="form-row"><label for="resolution-note">Analyst note</label><textarea class="field" id="resolution-note" rows="3" placeholder="Summarize the response decision"></textarea></div>`,'Resolve case',()=>{a.state='resolved';closeModal();toast(`${a.id} resolved · local demo`);render()})}else if(type==='contain'){modal('Confirm containment review',`<p>Containment for <b>${a.host}</b> is a high-impact action. In this concept it records a demo request; no endpoint action is sent.</p><div class="note">Verify host identity and blast radius before issuing a live response.</div>`,'Record request',()=>{closeModal();toast(`Containment request recorded for ${a.host} · demo only`)})}else if(type==='export-alerts'){const data=filteredAlerts().map(x=>({id:x.id,time:x.time,title:x.title,severity:x.sev,host:x.host,source:x.source,state:x.state}));download('terminus-alerts-demo.json',JSON.stringify(data,null,2));toast(`${data.length} visible alerts exported`)}else if(type==='export-report'){download('terminus-report-demo.csv','category,investigated,resolved,median_triage\nIdentity and access,48,44,3m 49s\nEndpoint,39,34,5m 02s\nNetwork / Snort,22,19,4m 35s\nOther,15,13,4m 11s\n');toast('Sample report exported')}else if(type==='generate-report')toast(`Report refreshed for ${state.reportRange} · illustrative data`);else if(type==='validate-workflow')toast('Definition validated · 4 connected nodes');else if(type==='save-workflow')toast('Workflow definition saved locally · execution remains disabled');else if(type==='edit-node')modal('Edit workflow step',`<p>Inspect this step’s configuration in the full product. The concept keeps workflow execution disabled.</p><div class="form-row"><label>Step name</label><input class="field" value="Review response step"></div>`,'Save step',()=>{closeModal();toast('Step updated in local demo')});else if(type==='test-event')modal('Submit test event',`<p>Choose a scenario to preview a local sample event. A production submission could create an investigation and notify configured channels.</p><div class="form-row"><label>Scenario</label><select class="field" id="test-scenario"><option>SSH authentication failures</option><option>Log4Shell lookup attempt</option><option>Rapid file encryption</option></select></div><div class="note">No event is sent to Wazuh, Snort, or Terminus from this concept.</div>`,'Preview event',()=>{const scenario=$('#test-scenario').value;closeModal();toast(`${scenario} payload previewed · demo only`)});else if(type==='invite-member')modal('Add organization member',`<p>Invite a colleague into Northstar Health.</p><div class="form-row"><label>Email</label><input class="field" type="email" id="invite-email" placeholder="name@northstar.example"></div><div class="form-row"><label>Role</label><select class="field"><option>Member</option><option>Viewer</option><option>Admin</option></select></div>`,'Add member',()=>{const v=$('#invite-email').value;if(!v.includes('@')){toast('Enter a valid email address');return}closeModal();toast(`Invitation to ${v} prepared · demo only`)});else if(type==='new-agent'||type==='view-integration'||type==='edit-member')modal(type==='new-agent'?'New agent':type==='edit-member'?'Edit member role':'Integration details',`<p>This interaction is represented locally in the concept. The production control would use the authenticated Terminus API and role checks.</p>`,'Done',()=>{closeModal();toast('Demo control updated')})}
function download(name,content){const blob=new Blob([content],{type:name.endsWith('.csv')?'text/csv':'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-page],[data-select],[data-open],[data-tab],[data-action],[data-toggle-agent],[data-agent]');if(!target)return;if(target.dataset.page){navigate(target.dataset.page);return}if(target.dataset.open){state.selected=target.dataset.open;state.dossierTab='assessment';navigate('incidents');return}if(target.dataset.select){state.selected=target.dataset.select;state.dossierTab='assessment';if(state.page!=='incidents')navigate('incidents');else{$('#dossier-slot').innerHTML=dossier();document.querySelectorAll('.table tr').forEach(r=>r.classList.remove('selected'));target.closest('tr')?.classList.add('selected')}return}if(target.dataset.tab){state.dossierTab=target.dataset.tab;$('#dossier-slot').innerHTML=dossier();return}if(target.dataset.toggleAgent!==undefined){let a=agents[+target.dataset.toggleAgent];a.enabled=!a.enabled;toast(`${a.name} ${a.enabled?'resumed':'paused'} · local demo`);render();return}if(target.dataset.agent!==undefined){const a=agents[+target.dataset.agent];modal(a.name,`<p>${a.role}</p><div class="facts"><div class="fact"><span>Tools</span><b>${a.tools}</b></div><div class="fact"><span>State</span><b>${a.enabled?'Active':'Paused'}</b></div></div>`,'Done',closeModal);return}if(target.dataset.action)action(target.dataset.action)});
document.addEventListener('input',e=>{if(e.target.id==='alert-search'){state.search=e.target.value;updateQueue()}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='time-filter')state.time=e.target.value;else if(id==='severity-filter')state.severity=e.target.value;else if(id==='status-filter')state.status=e.target.value;else if(id==='report-range'){state.reportRange=e.target.value;toast(`Report window set to ${e.target.selectedOptions[0].text}`)}else if(id==='workflow-select'){state.workflow=e.target.value;render()}else if(id==='theme-select'){state.theme=e.target.value;document.body.style.filter=state.theme==='contrast'?'contrast(1.13)':'';toast(`Appearance: ${e.target.selectedOptions[0].text}`)}if(['time-filter','severity-filter','status-filter'].includes(id))updateQueue()});
$('#menu-toggle').onclick=()=>$('#sidebar').classList.toggle('open');window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(pages[p]&&p!==state.page){state.page=p;render()}});state.page=pages[location.hash.slice(1)]?location.hash.slice(1):'overview';render();
</script></body></html>
