[project]
name = "terminus"
version = "0.1.0"
description = "Terminus — Commercial AI SOC Platform & Autonomous Incident Response"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx2[http2,brotli,zstd]>=0.1",
    "anyio>=4.6",
]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminus"]

# ─────────────────────────────────────────────────────────────────
# basedpyright - typeCheckingMode = "all"
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportMissingReturnType = "error"
reportPrivateUsage = "error"

# ─────────────────────────────────────────────────────────────────
# ruff - select = ["ALL"]
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    "D",
    "TC",
    "TRY",
    "EM",
    "G",
    "A",
    "ARG",
    "PLR2004",
    "B008",
    "T201",
    "S104",
    "BLE001",
    "PGH003",
    "PLC0415",
    "S110",
    "PYI063",
    "UP046",
    "UP040",
    "B024",
    "PLR0913",
    "PLR0917",
    "E501",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
    "S107",
    "ARG",
    "PLR2004",
    "SLF001",
    "D",
    "ANN",
    "E501",
    "PLC0415",
    "B017",
    "PT011",
    "I001",
]
"src/terminus/simulate.py" = [
    "T201",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:anyio._lazyimport",
]

[tool.pytest.ini_options.markers]
e2e = "end-to-end scenario tests"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ─────────────────────────────────────────────────────────────────
# uv script entrypoints
# ─────────────────────────────────────────────────────────────────
[tool.uv]
package = true

[project.scripts]
terminus-simulate = "terminus.simulate:main"
terminus-serve = "terminus.server.app:main"
