<!--
  File: target/ossec.conf
  Author: Team LARP
  Revision date: 2026-11-12
  Version: 0.1.0
  Purpose: Minimal Wazuh agent configuration for SSH authentication telemetry.
-->
<ossec_config>
  <client>
    <server>
      <address>__WAZUH_MANAGER__</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
    </enrollment>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- rsyslog receives sshd's syslog output and writes auth.log. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
  </active-response>

  <!-- Keep this fixture focused on SSH telemetry instead of inventory noise. -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <syscheck>
    <disabled>yes</disabled>
  </syscheck>
  <sca>
    <enabled>no</enabled>
  </sca>
  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
